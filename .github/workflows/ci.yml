name: ЗИоВПО CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    # Spin up a real PostgreSQL database for tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Restore the HTTPS keystore from a GitHub Secret
      # Store it as base64: base64 -i keystore.jks | pbcopy
      # Then add as secret KEYSTORE_BASE64 in GitHub → Settings → Secrets
      - name: Restore keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode \
            > src/main/resources/keystore.jks

      # Step: run tests
      - name: Test
        env:
          DB_URL: jdbc:postgresql://localhost:5432/test_db
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: mvn test -B

      # Step: build the JAR
      - name: Build
        env:
          DB_URL: jdbc:postgresql://localhost:5432/test_db
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: mvn package -DskipTests -B

      # Upload the built JAR as an artifact
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ziovpo-jar
          path: target/*.jar
          retention-days: 7

      # IMPORTANT: remove the keystore so it's never in the workspace
      - name: Remove keystore
        if: always()
        run: rm -f src/main/resources/keystore.jks
