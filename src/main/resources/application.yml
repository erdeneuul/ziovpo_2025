spring:
  datasource:
    # These values come from environment variables (never hardcode passwords!)
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ziovpo_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update   # auto-creates/updates tables on startup
    show-sql: false

server:
  port: 8443
  ssl:
    enabled: true
    key-store: classpath:keystore.jks          # your HTTPS certificate
    key-store-password: ${KEYSTORE_PASSWORD}
    key-store-type: JKS
    key-alias: ${KEY_ALIAS:mykey}

jwt:
  secret: ${JWT_SECRET}                        # long random string, store in secrets
  access-token-expiration-ms: 900000           # 15 minutes
  refresh-token-expiration-ms: 604800000       # 7 days
